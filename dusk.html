    <script>
        // トップボタン
        const button = document.querySelector('.top-btn');

        button.addEventListener('click', () => {
            window.scroll({
                top: 0,
                behavior: "smooth"
            });
        });

        // ボタン表示
        window.addEventListener('scroll', () => {
            if (window.scrollY > 800) {
                button.classList.add('show');
            } else {
                button.classList.remove('show');
            }
        });

        // ギャラリー
        const gallery = document.querySelector('.photo');

        let scrollTarget = 0;
        let current = 0;

        let isEnabled = false;
        let wheelHandler;

        function enablePCScroll() {
            if (isEnabled) return;
            isEnabled = true;

            wheelHandler = (e) => {
                e.preventDefault();
                scrollTarget += e.deltaY * 0.6;
            };

            gallery.addEventListener('wheel', wheelHandler, { passive: false });

            function animate() {
                if (!isEnabled) return;

                current += (scrollTarget - current) * 0.08;
                gallery.scrollLeft = current;
                requestAnimationFrame(animate);
            }

            animate();
        }

        function disablePCScroll() {
            if (!isEnabled) return;
            isEnabled = false;

            gallery.removeEventListener('wheel', wheelHandler);
            wheelHandler = null;
        }

        function checkMode() {
            const isPC = window.matchMedia('(min-width: 769px)').matches;

            if (isPC) {
                enablePCScroll();
            } else {
                disablePCScroll();
            }
        }

        checkMode();

        window.addEventListener('resize', checkMode);


        // ギャラリーのタイトル文字
        document.querySelectorAll('.gallery-item img').forEach(img => {

            const fileName = decodeURIComponent(
                img.src
                    .split('/')
                    .pop()
                    .replace(/\.[^.]+$/, '')
            );

            img.alt = fileName;

            const parent = img.closest('.gallery-item');

            parent.dataset.caption = fileName;

            const title = parent.querySelector('.title');

            if (title) {
                title.textContent = fileName;
            }

        });

        // Fancybox 初期化
        Fancybox.bind("[data-fancybox='photo']", {
            Thumbs: false,   // サムネイル非表示
            Toolbar: true,   // ツールバー表示
            loop: true,      // ループ可能
        });

        // フェードイン
        const observer = new IntersectionObserver(
            (entries) => {
                entries.forEach((entry) => {
                    if (entry.isIntersecting) {
                        entry.target.classList.add('show');
                        observer.unobserve(entry.target);
                    }
                });
            },
            {
                threshold: 0.2
            }
        );

        document
            .querySelectorAll('.photo-fadein')
            .forEach((item) => {
                observer.observe(item);
            });
    </script>

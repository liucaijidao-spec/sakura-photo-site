<!DOCTYPE html>

    <!-- sns-icon -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">

</head>

<body id="contact">
    <header>
        <div class="all-container">
            <nav>
                <ul>
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="dawn.html">DAWN</a></li>
                    <li><a href="dusk.html">DUSK</a></li>
                    <li><a href="profile.html">PROFILE</a></li>
                    <li><a href="news.html">NEWS</a></li>
                </ul>
            </nav>
            <div class="letter">
                <a href="contact.html">
                    <svg xmlns="http://www.w3.org/2000/svg" width="2em" height="2em" viewBox="0 0 20 20">
                        <g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd">
                            <path
                                d="M17 4H3a.5.5 0 0 0-.5.5v11a.5.5 0 0 0 .5.5h14a.5.5 0 0 0 .5-.5v-11A.5.5 0 0 0 17 4M3.5 15V5h13v10z" />
                            <path
                                d="m17.324 4.88l-7.045 6a.5.5 0 0 1-.65-.001l-6.956-6A.5.5 0 0 1 3 4h14a.5.5 0 0 1 .324.88M15.642 5H4.345l5.612 4.841z" />
                        </g>
                    </svg>
                    <p>CONTACT</p>
                </a>
            </div>
        </div>

    </header>

    <button class="hmb js-hmb sp-show" aria-label="メニューを開く">
        <span></span>
        <span></span>
        <span></span>
    </button>

    <div class="hmb-menu">
        <nav>
            <ul>
                <li><a href="index.html">HOME</a></li>
                <li><a href="dawn.html">DAWN</a></li>
                <li><a href="dusk.html">DUSK</a></li>
                <li><a href="profile.html">PROFILE</a></li>
                <li><a href="news.html">NEWS</a></li>
                <li class="contact"><a href="contact.html">CONTACT</a></li>

                <li class="sns">
                    <a href="https://www.instagram.com/_re_collect?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw=="
                        aria-label="Instagram">
                        <i class="fa-brands fa-instagram"></i>
                    </a>
                    <a href="" aria-label="X">
                        <i class="fa-brands fa-x-twitter"></i>
                    </a>
                    <a href="https://www.threads.com/@_re_collect" aria-label="Threads">
                        <i class="fa-brands fa-threads"></i>
                    </a>
                </li>
            </ul>
        </nav>
    </div>


    <main>
        <div class="contact-bg">
            <div class="all-container">
                <div class="contents-container">
                    <div class="box-title">
                        <div class="title">
                            <h2>Contact</h2>
                            <p>お問い合わせ</p>
                            <div class="border"></div>
                        </div>
                    </div>

                    <div class="inner">
                        <div class="message">
                            <p>
                                作品のご感想や撮影のご相談など、
                                どうぞお気軽にご連絡ください。
                                あなたからのメッセージをお待ちしています。
                            </p>
                        </div>
                        <div class="contact-box">
                            <section class="contact-container">
                                <form id="contact-form">
                                    <div class="contents">
                                        <div class="row">
                                            <label for="name">お名前</label>
                                            <div class="input-box">
                                                <input type="text" id="name" name="name" placeholder="田中　太郎" required>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <label for="furigana">ふりがな</label>
                                            <div class="input-box">
                                                <input type="text" id="furigana" name="furigana" placeholder="たなか　たろう"
                                                    required>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <label for="email">E-mail</label>
                                            <div class="input-box">
                                                <input type="email" id="email" name="email"
                                                    placeholder="testtest@gmail.com" required>
                                            </div>
                                        </div>
                                        <div class="row">
                                            <label for="message">お問い合わせ内容</label>
                                            <div class="input-box">
                                                <textarea id="message" name="message" rows="10" required></textarea>
                                            </div>
                                        </div>
                                    </div>

                                    <div class="btn-box">
                                        <button class="btn" type="submit">
                                            <span>送信する</span>
                                            <svg xmlns="http://www.w3.org/2000/svg" width="2em" height="2em"
                                                viewBox="0 0 20 20">
                                                <g fill="currentColor" fill-rule="evenodd" clip-rule="evenodd">
                                                    <path
                                                        d="M17 4H3a.5.5 0 0 0-.5.5v11a.5.5 0 0 0 .5.5h14a.5.5 0 0 0 .5-.5v-11A.5.5 0 0 0 17 4M3.5 15V5h13v10z" />
                                                    <path
                                                        d="m17.324 4.88l-7.045 6a.5.5 0 0 1-.65-.001l-6.956-6A.5.5 0 0 1 3 4h14a.5.5 0 0 1 .324.88M15.642 5H4.345l5.612 4.841z" />
                                                </g>
                                            </svg>
                                        </button>
                                    </div>
                                </form>
                            </section>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <div class="all-container">
        <footer>
            <div class="sns">
                <a href="https://www.instagram.com/_re_collect?utm_source=ig_web_button_share_sheet&igsh=ZDNlZDc0MzIxNw=="
                    aria-label="Instagram">Instagram</a>
                <a href="https://www.threads.com/@_re_collect" aria-label="Threads">Threads</a>
                <a href="https://x.com/_re_collect?s=20" aria-label="X">X</a>
            </div>
            <p>©Yoshida Sakura. All rights reserved.</p>
        </footer>
    </div>
</body>

<script>
    const form = document.getElementById('contact-form');

    form.addEventListener('submit', async (e) => {
        e.preventDefault();

        const submitBtn = form.querySelector('button[type="submit"]');

        submitBtn.disabled = true;
        submitBtn.querySelector('span').textContent = '送信中...';

        const formData = new FormData(form);

        try {
            const response = await fetch(
                'https://script.google.com/macros/s/AKfycbwXR9bBy-HlYj0T-fULJBuIeZvPR6Ho5gRJp1zvOoapRkdp-R_2PEQiAguu4xErV-Sw/exec',
                {
                    method: 'POST',
                    body: formData
                }
            );

            if (!response.ok) {
                throw new Error();
            }

            window.location.href = 'thanks-message.html';

        } catch (error) {

            submitBtn.disabled = false;
            submitBtn.querySelector('span').textContent = '送信する';

            alert('送信に失敗しました。時間をおいて再度お試しください。');

            console.error(error);
        }
    });
</script>

</html>
